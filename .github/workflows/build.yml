name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp ovl-sleep-timer.ovl dist/
          cd out && zip -r ../dist/ovl-sleep-timer.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ovl-sleep-timer
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
