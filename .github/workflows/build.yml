name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this tag (e.g. v1.0.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219 # pinned so a toolchain update cannot silently change builds
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp ovl-sleep-timer.ovl dist/
          cd out && zip -r ../dist/ovl-sleep-timer.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ovl-sleep-timer
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            **Install (Ultrahand):** extract `ovl-sleep-timer.zip` to the root of the SD card
            (or copy `ovl-sleep-timer.ovl` to `/switch/.overlays/`), then reopen Ultrahand
            and pick **Sleep Timer** from the overlay list.

            Requires firmware 15.0.0+. If the console doesn't sleep, the overlay shows the
            error code next to *Timer*; please report it. See CHANGELOG.md for details.
